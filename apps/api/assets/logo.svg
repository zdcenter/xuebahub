<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 1. 品牌超椭圆底座渐变：深邃星空极光蓝 -->
    <linearGradient id="xb-base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- 2. 科技云朵外轮廓光晕渐变 (天青到蔚蓝) -->
    <linearGradient id="xb-cloud-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.2" />
    </linearGradient>

    <!-- 3. 主体微晶云朵渐变 (纯净洁白到冰晶蓝) -->
    <linearGradient id="xb-cloud-main" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>

    <!-- 4. 云朵立体投影渐变 -->
    <linearGradient id="xb-cloud-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.35" />
    </linearGradient>

    <!-- 5. 【学霸黄金冠顶】醒目璀璨金黄色学霸帽渐变 (高对比度·彻底解决与白云融为一体的问题) -->
    <!-- 帽顶菱形主表面：亮金到暖金 -->
    <linearGradient id="xb-hat-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 帽顶立体阴影切面：深金到琥珀金 -->
    <linearGradient id="xb-hat-facet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 帽子圆柱底座：立体深金与琥珀铜，与白云产生绝对清晰界线 -->
    <linearGradient id="xb-hat-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- 帽纽与流苏亮金渐变 -->
    <linearGradient id="xb-tassel-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 6. 云核资源极速光箭与转存流光渐变 -->
    <linearGradient id="xb-arrow-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- 投影与光晕滤镜 -->
    <filter id="xb-shadow-base" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
    <filter id="xb-cloud-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0C4A6E" flood-opacity="0.25" />
    </filter>
    <!-- 金色学士帽立体投影，强化在白云上的立体浮起感 -->
    <filter id="xb-hat-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#78350F" flood-opacity="0.4" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.3" />
    </filter>
    <filter id="xb-star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- 1. 超椭圆应用级徽章底座 (Squircle App Base) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#xb-base-grad)" filter="url(#xb-shadow-base)" />
  <!-- 底座微晶内发光描边 -->
  <rect x="34" y="34" width="444" height="444" rx="106" stroke="rgba(255, 255, 255, 0.22)" stroke-width="4" />

  <!-- 底座背景微弱科技网络光圈 -->
  <circle cx="256" cy="285" r="185" stroke="rgba(255, 255, 255, 0.06)" stroke-width="2" stroke-dasharray="6 8" />
  <circle cx="256" cy="285" r="145" stroke="rgba(56, 189, 248, 0.12)" stroke-width="2" />

  <!-- 2. 【核心云朵】海量云端网盘与知识库 (Cloud of Drive & Knowledge) -->
  <!-- 云朵后方科技青光晕层 -->
  <path d="M165 382 C120 382 86 348 86 305 C86 266 114 233 152 229 C164 175 211 135 268 135 C328 135 377 179 385 238 C418 244 442 272 442 306 C442 348 408 382 365 382 Z"
        fill="url(#xb-cloud-glow)" />

  <!-- 前层立体丰润白晶云朵 -->
  <g filter="url(#xb-cloud-drop)">
    <path d="M168 378 C126 378 94 346 94 306 C94 269 120 238 156 234 C167 182 212 144 266 144 C323 144 370 186 378 242 C409 248 432 274 432 306 C432 346 400 378 360 378 Z"
          fill="url(#xb-cloud-main)" />
    <!-- 云朵下半部立体环境反射投影 -->
    <path d="M94 306 C94 346 126 378 168 378 L360 378 C400 378 432 346 432 306 C432 288 425 271 414 259 C394 332 328 368 250 368 C176 368 120 336 102 270 C97 281 94 293 94 306 Z"
          fill="url(#xb-cloud-shadow)" />
  </g>

  <!-- 3. 【学霸象征】云巅之上的黄色学霸帽 (Vibrant Gold Scholar Cap) 极度醒目·蓝白黄完美层次 -->
  <g filter="url(#xb-hat-shadow)">
    <!-- 帽子立体圆弧基座 (深琥珀金柱体，扎实压在白云顶峰，分界绝对清晰) -->
    <path d="M198 164 L198 200 C198 222 228 238 266 238 C304 238 334 222 334 200 L334 164 C314 178 290 186 266 186 C242 186 218 178 198 164 Z"
          fill="url(#xb-hat-base)" />
    <!-- 基座底部深金阴影切线 -->
    <path d="M206 198 C206 214 232 228 266 228 C300 228 326 214 326 198 C326 186 300 178 266 178 C232 178 206 186 206 198 Z"
          fill="#78350F" opacity="0.45" />

    <!-- 菱形帽顶 (上表面·耀眼纯正金黄流光，醒目拔尖) -->
    <!-- 后半部阴影面 -->
    <polygon points="266,92 384,138 266,184 148,138" fill="url(#xb-hat-facet)" stroke="#B45309" stroke-width="2" />
    <!-- 前半部高光主受光面 -->
    <polygon points="266,92 384,138 266,142 148,138" fill="url(#xb-hat-top)" />
    <!-- 帽顶高光金亮金边修饰 -->
    <polygon points="266,94 380,138 266,180 152,138" fill="none" stroke="rgba(255, 255, 255, 0.65)" stroke-width="2.5" />

    <!-- 学士帽帽纽与金色飘逸流苏 (Tassel) -->
    <!-- 中心金纽 -->
    <circle cx="266" cy="138" r="7" fill="url(#xb-tassel-gold)" stroke="#B45309" stroke-width="1.5" />
    <!-- 飘落流苏绳带 -->
    <path d="M266 138 Q 344 148 358 180" stroke="url(#xb-tassel-gold)" stroke-width="6.5" stroke-linecap="round" fill="none" />
    <path d="M266 138 Q 344 148 358 180" stroke="#B45309" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.3" />
    <!-- 流苏垂穗吊坠包 (精致双色流苏坠) -->
    <path d="M358 180 L352 216 C352 220 364 220 364 216 L358 180 Z" fill="url(#xb-tassel-gold)" stroke="#B45309" stroke-width="1.5" />
    <circle cx="358" cy="182" r="4" fill="#FEF08A" />
  </g>

  <!-- 4. 【资源与极速转存】云心极速冲天资源光箭与展翅书页 (Resource Sync Vault & Book) -->
  <!-- 展翅教辅书页 (托起知识与真题) -->
  <g transform="translate(0, 20)">
    <!-- 左书页 -->
    <path d="M266 312 C236 292 196 290 168 296 C162 297 158 303 158 310 L158 334 C190 326 230 328 266 348 Z"
          fill="#38BDF8" opacity="0.85" />
    <!-- 右书页 -->
    <path d="M266 312 C296 292 336 290 364 296 C370 297 374 303 374 310 L374 334 C342 326 302 328 266 348 Z"
          fill="#38BDF8" opacity="0.85" />

    <!-- 云核中央：疾速转存冲天光箭 (Resource Upload / Fast Save Arrow) -->
    <path d="M266 216 L306 264 L280 264 L280 330 L252 330 L252 264 L226 264 Z"
          fill="url(#xb-arrow-grad)" />
    <!-- 光箭中心高光反白 -->
    <path d="M266 222 L294 258 L274 258 L274 324 L258 324 L258 258 L238 258 Z"
          fill="rgba(255, 255, 255, 0.6)" />
  </g>

  <!-- 5. 【学霸荣耀星芒】象征状元高分与拔尖 (Scholar Sparkle Stars) -->
  <g filter="url(#xb-star-glow)">
    <!-- 右上主星芒 (耀眼黄金星) -->
    <path d="M392 100 L398 116 L416 120 L400 131 L404 148 L392 136 L380 148 L384 131 L368 120 L386 116 Z"
          fill="url(#xb-hat-top)" stroke="#B45309" stroke-width="1.5" />
    <!-- 左上辅星芒 (精致四角星) -->
    <path d="M138 162 Q 138 174 126 174 Q 138 174 138 186 Q 138 174 150 174 Q 138 174 138 162 Z"
          fill="url(#xb-hat-top)" opacity="0.9" />
  </g>

  <!-- 底部微字标点缀：直观印证 xuebaw.com 资源站定位 -->
  <g opacity="0.75">
    <circle cx="218" cy="428" r="3" fill="#60A5FA" />
    <text x="230" y="432" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#93C5FD" letter-spacing="3">XUEBAW.COM</text>
    <circle cx="376" cy="428" r="3" fill="#60A5FA" />
  </g>
</svg>
