<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>学霸网 - 中小学期中期末真题密卷与统编电子课本高清网盘一键转存</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png?v=2">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <link rel="alternate icon" href="/favicon.ico?v=2">

  <!-- PWA & 移动端独立应用配置 (Splash Logo 与无边框沉浸体验) -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="学霸网">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script>
    (function() {
      // 0ms 原生级品牌启动屏握手器 (Angular 视图挂载后平滑淡出)
      window.__hidePwaSplash = function() {
        var splash = document.getElementById('pwa-native-splash');
        if (!splash || splash.classList.contains('pwa-splash-fade')) return;
        splash.classList.add('pwa-splash-fade');
        setTimeout(function() {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 380);
      };

      // 安全看门狗保底：极端异常下 3.5s 强制平滑淡出，绝不锁屏
      setTimeout(function() {
        if (window.__hidePwaSplash) window.__hidePwaSplash();
      }, 3500);
    })();
  </script>

  <style>
    /* ════════════════════════════════════════════════════════════════
       0ms 原生级学霸网启动闪屏 (立于 app-root 之外，消灭白屏与加载抖动)
       ════════════════════════════════════════════════════════════════ */
    .pwa-native-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #f8fafc;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      z-index: 9999999;
      user-select: none;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s ease-out;
      will-change: opacity, transform;
    }
    .pwa-splash-fade {
      opacity: 0 !important;
      transform: scale(1.02) !important;
      pointer-events: none !important;
    }
    .pwa-splash-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 360px;
      transition: all 0.3s ease;
    }
    .pwa-splash-logo-wrap {
      position: relative;
      width: 96px;
      height: 96px;
      margin-bottom: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pwaLogoPulse 2.4s ease-in-out infinite;
      transition: width 0.35s ease, height 0.35s ease, margin-bottom 0.35s ease;
    }
    .pwa-splash-glow {
      position: absolute;
      inset: -14px;
      border-radius: 36px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.38) 0%, rgba(16, 185, 129, 0.2) 50%, transparent 72%);
      filter: blur(18px);
      z-index: 0;
    }
    .pwa-splash-svg {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
      filter: drop-shadow(0 12px 24px rgba(15, 23, 42, 0.22));
    }
    .pwa-splash-brand {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #0d9488 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.15;
    }
    .pwa-splash-slogan {
      font-size: 13px;
      font-weight: 600;
      color: #64748b;
      letter-spacing: 0.04em;
      margin-bottom: 26px;
    }
    .pwa-splash-track {
      width: 150px;
      height: 3.5px;
      background: rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .pwa-splash-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 45%;
      border-radius: 999px;
      background: linear-gradient(90deg, #2563eb, #0ea5e9, #10b981);
      animation: pwaTrackSlide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    /* 📱 平板端 (640px+) 响应式放大 */
    @media (min-width: 640px) {
      .pwa-splash-box {
        max-width: 460px;
        padding: 36px;
      }
      .pwa-splash-logo-wrap {
        width: 128px;
        height: 128px;
        margin-bottom: 26px;
      }
      .pwa-splash-glow {
        inset: -20px;
        filter: blur(24px);
      }
      .pwa-splash-brand {
        font-size: 38px;
        margin-bottom: 8px;
      }
      .pwa-splash-slogan {
        font-size: 15px;
        margin-bottom: 30px;
      }
      .pwa-splash-track {
        width: 210px;
        height: 4px;
      }
    }

    /* 💻 电脑大屏 (1024px+) 震撼通透呈现 */
    @media (min-width: 1024px) {
      .pwa-splash-box {
        max-width: 520px;
        padding: 44px;
      }
      .pwa-splash-logo-wrap {
        width: 144px;
        height: 144px;
        margin-bottom: 30px;
      }
      .pwa-splash-glow {
        inset: -24px;
        filter: blur(28px);
      }
      .pwa-splash-brand {
        font-size: 42px;
        margin-bottom: 10px;
      }
      .pwa-splash-slogan {
        font-size: 16px;
        margin-bottom: 34px;
      }
      .pwa-splash-track {
        width: 240px;
        height: 4.5px;
      }
    }

    @keyframes pwaLogoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.045); }
    }
    @keyframes pwaTrackSlide {
      0% { left: -45%; width: 30%; }
      50% { left: 35%; width: 55%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
  <!-- 搜索引擎爬虫/无JS环境：直接隐藏闪屏，直接透传完整预渲染内容 -->
  <noscript>
    <style>#pwa-native-splash { display: none !important; }</style>
  </noscript>
</head>
<body class="bg-slate-50 text-slate-900 antialiased selection:bg-blue-600 selection:text-white">

  <div id="pwa-native-splash" class="pwa-native-splash" aria-hidden="true" role="presentation">

          <path d="M 256 388 C 306 352 364 346 400 352 C 407 353 412 348 412 341 L 412 292 C 412 285 406 280 400 279 C 360 273 304 279 256 312 Z" 
                fill="url(#xb-sp-page-under)" opacity="0.6" />

          <!-- 书本主页 -->
          <path d="M 256 372 C 208 335 152 329 116 335 C 109 336 104 331 104 324 L 104 271 C 104 264 110 259 116 258 C 156 252 212 258 256 292 Z" 
                fill="url(#xb-sp-page-main)" />
          <path d="M 256 372 C 304 335 360 329 396 335 C 403 336 408 331 408 324 L 408 271 C 408 264 402 259 396 258 C 356 252 300 258 256 292 Z" 
                fill="url(#xb-sp-page-main)" />
          <path d="M 254 292 L 258 292 L 258 372 L 254 372 Z" fill="#CBD5E1" opacity="0.6" />

          <!-- 金色学士帽 -->
          <path d="M 198 184 L 198 214 C 198 234 224 248 256 248 C 288 248 314 234 314 214 L 314 184 C 294 196 276 202 256 202 C 236 202 218 196 198 184 Z" 
                fill="#B45309" />
          <polygon points="256,124 148,168 256,212 256,124" fill="url(#xb-sp-gold-light)" />

          <polygon points="256,125 151,168 256,210 361,168" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2" />

          <path d="M 256 168 Q 336 178 350 208" stroke="url(#xb-sp-tassel)" stroke-width="6" stroke-linecap="round" fill="none" />
          <path d="M 350 208 L 344 238 C 344 241 356 241 356 238 L 350 208 Z" fill="url(#xb-sp-tassel)" />
          <circle cx="350" cy="209" r="4" fill="#FEF08A" />

          <!-- 四芒启明星 -->
          <path d="M 256 68 Q 256 86 274 86 Q 256 86 256 104 Q 256 86 238 86 Q 256 86 256 68 Z" fill="#FFFFFF" />
          <circle cx="256" cy="86" r="3" fill="#FEF08A" />
        </svg>
      </div>

      <!-- 品牌名称与标语 -->
      <div class="pwa-splash-brand">学霸网</div>
      <div class="pwa-splash-slogan">中小学同步备考真题与课本资料库</div>

      <!-- 极简动态进度滑块 -->
      <div class="pwa-splash-track">
        <div class="pwa-splash-bar"></div>
      </div>
    </div>
  </div>
  <app-root></app-root>
</body>
