<div class="min-h-screen bg-slate-50/60 pb-20">
  <div class="max-w-7xl 2xl:max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">

    <!-- 面包屑 -->
    <nav class="flex items-center gap-1.5 text-xs text-slate-500">
      <a routerLink="/" class="hover:text-emerald-700 transition">首页</a>
      <span>/</span>
      <span class="text-slate-400">专题专辑</span>
      <span *ngIf="collection()">/</span>
      <span *ngIf="collection()" class="text-slate-800 font-semibold truncate">{{ collection()?.title }}</span>
    </nav>

    <!-- 加载态 -->
    <div *ngIf="isLoading()" class="bg-white rounded-3xl border border-slate-200/80 p-12 text-center text-slate-500">
      正在加载专辑内容...
    </div>

    <!-- 未找到 -->
    <div *ngIf="!isLoading() && notFound()" class="bg-white rounded-3xl border border-slate-200/80 p-12 text-center space-y-3">
      <div class="text-3xl">📚</div>
      <h1 class="text-lg font-bold text-slate-800">该专辑不存在或已下线</h1>
      <a routerLink="/" class="inline-block px-4 py-2 rounded-xl bg-emerald-600 text-white text-sm font-bold">返回首页</a>
    </div>

    <!-- 专辑主体 -->
    <ng-container *ngIf="!isLoading() && !notFound() && collection() as col">
      <div class="bg-gradient-to-r from-emerald-900 via-emerald-800 to-teal-900 text-white rounded-3xl p-6 sm:p-8 shadow-md">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="space-y-2">
            <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/15 text-emerald-100 text-xs font-bold">
              <span>📚</span>
              <span>系列专辑合集 · 共 {{ items().length }} 份资源</span>
            </div>
            <h1 class="text-xl sm:text-3xl font-extrabold tracking-tight">{{ col.title }}</h1>
            <p *ngIf="col.description" class="text-xs sm:text-sm text-emerald-100/90 max-w-3xl leading-relaxed">
              {{ col.description }}
            </p>
          </div>
        </div>
      </div>

      <div *ngIf="items().length === 0" class="bg-white rounded-3xl border border-slate-200/80 p-12 text-center text-slate-500">
        该专辑暂未关联已发布资源
      </div>

      <div *ngIf="items().length > 0" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 2xl:grid-cols-6 gap-4 sm:gap-5">
        <ng-container *ngFor="let item of items()">
          <app-book-card *ngIf="isBookItem(item); else normalCard" [resource]="item"></app-book-card>
          <ng-template #normalCard>
            <app-resource-card [resource]="item"></app-resource-card>
          </ng-template>
        </ng-container>
      </div>
    </ng-container>

  </div>
</div>
