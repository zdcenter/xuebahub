<div class="min-h-screen bg-slate-50/60 pb-20 pt-6">
  <div class="max-w-7xl 2xl:max-w-[1600px] mx-auto px-4 sm:px-6 lg:px-8 space-y-6">

    <!-- 面包屑导航 -->
    <nav class="flex items-center space-x-2 text-xs sm:text-sm text-slate-600 font-medium">
      <a routerLink="/" class="hover:text-emerald-700 transition">首页</a>
      <span class="text-slate-400">/</span>
      <span class="text-slate-900 font-semibold">精选专辑</span>
    </nav>

    <!-- 顶部横幅卡片 -->
    <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-6 sm:p-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
      <div class="space-y-2">
        <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-bold">
          <span>📚</span>
          <span>系列丛书与成套资料合集</span>
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">
          精选学习专辑
        </h1>
        <p class="text-sm text-slate-600 max-w-2xl leading-relaxed">
          将同系列多本独立分册、配套解答与专题套卷归整为完整专辑，点击任意专辑即可一站查看全套资源并逐册转存。
        </p>
      </div>
      <div *ngIf="!isLoading()" class="shrink-0 px-4 py-2.5 rounded-2xl bg-slate-50 border border-slate-200/80 text-center">
        <div class="text-2xl font-black text-emerald-700 font-mono">{{ collections().length }}</div>
        <div class="text-xs text-slate-500 font-medium">个精选专辑</div>
      </div>
    </div>

    <!-- 加载骨架屏 -->
    <div *ngIf="isLoading()" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <div *ngFor="let _ of [1,2,3,4,5,6]" class="bg-white rounded-3xl border border-slate-200 p-5 animate-pulse space-y-4">
        <div class="h-36 bg-slate-100 rounded-2xl"></div>
        <div class="h-5 bg-slate-200 rounded w-2/3"></div>
        <div class="h-4 bg-slate-100 rounded w-full"></div>
      </div>
    </div>

    <!-- 空状态 -->
    <div *ngIf="!isLoading() && collections().length === 0"
         class="bg-white rounded-3xl border border-slate-200 p-12 text-center space-y-3">
      <div class="text-4xl">📚</div>
      <h2 class="text-lg font-bold text-slate-800">暂无公开专辑</h2>
      <p class="text-sm text-slate-500">管理员在后台创建并启用专辑后，将自动展示在此处。</p>
      <a routerLink="/" class="inline-flex items-center px-5 py-2 rounded-full bg-emerald-600 text-white text-sm font-bold hover:bg-emerald-700 transition">
        返回首页浏览全部资料
      </a>
    </div>

    <!-- 专辑卡片网格 -->
    <div *ngIf="!isLoading() && collections().length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <a *ngFor="let col of collections()"
         [routerLink]="['/collection', col.slug]"
         class="group bg-white rounded-3xl border border-slate-200/90 shadow-sm hover:shadow-xl hover:border-emerald-400 hover:-translate-y-1 transition-all duration-300 overflow-hidden flex flex-col">
        <!-- 封面区 -->
        <div class="h-44 bg-gradient-to-br from-emerald-600 via-teal-700 to-slate-900 relative overflow-hidden flex items-center justify-center p-5">
          <img *ngIf="col.cover_image"
               [src]="col.cover_image"
               [alt]="col.title"
               class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
               loading="lazy" />
          <div *ngIf="!col.cover_image" class="text-center text-white space-y-2 relative z-10">
            <div class="text-4xl drop-shadow">📚</div>
            <div class="text-base font-black tracking-tight line-clamp-2 px-2 drop-shadow">{{ col.title }}</div>
          </div>
          <span class="absolute top-3 right-3 z-10 px-2.5 py-1 rounded-full bg-black/60 backdrop-blur-md text-white text-xs font-bold border border-white/20">
            共 {{ col.resource_count || 0 }} 份资料
          </span>
        </div>

        <!-- 信息区 -->
        <div class="p-5 flex-1 flex flex-col justify-between space-y-3">
          <div class="space-y-1.5">
            <h2 class="text-base sm:text-lg font-extrabold text-slate-900 group-hover:text-emerald-700 transition line-clamp-1">
              {{ col.title }}
            </h2>
            <p class="text-xs sm:text-sm text-slate-500 line-clamp-2 leading-relaxed">
              {{ col.description || '点击查看该专辑收录的全套分册与网盘下载链接' }}
            </p>
          </div>
          <div class="pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-emerald-700">
            <span>查看全套合集</span>
            <span class="group-hover:translate-x-1 transition-transform">→</span>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
