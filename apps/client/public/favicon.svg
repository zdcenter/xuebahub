<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 背景超椭圆渐变 -->
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- 学士帽双色渐变 -->
    <linearGradient id="fav-gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="fav-gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- 1. 超级椭圆底座 (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#fav-bg)" />
  <rect x="28" y="28" width="456" height="456" rx="116" stroke="rgba(255, 255, 255, 0.25)" stroke-width="6" fill="none" />

  <!-- 2. 【智慧之书】粗线条高对比展翅书页 (Favicon 极小尺寸下绝对清晰) -->
  <path d="M 256 376 C 206 338 146 332 108 338 C 100 339 96 333 96 325 L 96 268 C 96 260 102 255 108 254 C 150 248 210 254 256 290 Z" 
        fill="#FFFFFF" />
  <path d="M 256 376 C 306 338 366 332 404 338 C 412 339 416 333 416 325 L 416 268 C 416 260 410 255 404 254 C 362 248 302 254 256 290 Z" 
        fill="#FFFFFF" />

  <!-- 3. 【学霸黄金帽】高反差菱形切面 -->
  <path d="M 194 180 L 194 212 C 194 234 222 250 256 250 C 290 250 318 234 318 212 L 318 180 C 296 194 276 200 256 200 C 236 200 216 194 194 180 Z" 
        fill="#92400E" />

  <polygon points="256,116 136,164 256,212 256,116" fill="url(#fav-gold-light)" />
  <polygon points="256,116 376,164 256,212 256,116" fill="url(#fav-gold-dark)" />
  <polygon points="256,118 140,164 256,210 372,164" fill="none" stroke="rgba(255, 255, 255, 0.5)" stroke-width="3" />

  <!-- 中心纽扣与流苏 -->
  <circle cx="256" cy="164" r="10" fill="#FEF08A" stroke="#B45309" stroke-width="2" />
  <path d="M 256 164 Q 346 174 362 210" stroke="#FEF08A" stroke-width="8" stroke-linecap="round" fill="none" />
  <circle cx="362" cy="212" r="6" fill="#FEF08A" />

  <!-- 4. 启明星 -->
  <path d="M 256 56 Q 256 76 276 76 Q 256 76 256 96 Q 256 76 236 76 Q 256 76 256 56 Z" 
        fill="#FFFFFF" />
</svg>
