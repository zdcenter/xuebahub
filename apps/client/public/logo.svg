<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- 1. 背景超椭圆渐变：清澈深邃的科技皇家蓝 -->
    <linearGradient id="xb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- 2. 书本副页与高光渐变 -->
    <linearGradient id="xb-page-under" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <linearGradient id="xb-page-main" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- 3. 学士帽金色高光与暗面双色渐变 -->
    <linearGradient id="xb-gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="xb-gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="xb-tassel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- 柔和微投影：增强图标在任何背景下的立体质感 -->
    <filter id="xb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25" />
    </filter>

    <filter id="xb-star-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#FDE047" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. 超级椭圆底座 (Squircle) · 现代移动端应用与顶级 SaaS 规范 -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#xb-bg)" />
  <!-- 底座内侧微光边缘 -->
  <rect x="34" y="34" width="444" height="444" rx="110" stroke="rgba(255, 255, 255, 0.22)" stroke-width="3" fill="none" />

  <!-- 主体图形容器 (带轻盈自然投影) -->
  <g filter="url(#xb-glow)">

    <!-- 2. 【智慧之书 / 展翅书卷】象征海量真题与同步教辅 -->
    <!-- 下层衬页 (透出轻盈科技青蓝，丰富层次) -->
    <path d="M 256 388 C 206 352 148 346 112 352 C 105 353 100 348 100 341 L 100 292 C 100 285 106 280 112 279 C 152 273 208 279 256 312 Z" 
          fill="url(#xb-page-under)" opacity="0.6" />
    <path d="M 256 388 C 306 352 364 346 400 352 C 407 353 412 348 412 341 L 412 292 C 412 285 406 280 400 279 C 360 273 304 279 256 312 Z" 
          fill="url(#xb-page-under)" opacity="0.6" />

    <!-- 主书页 (纯净洁白翻开的弧度，充满力量感与智慧) -->
    <!-- 左书页 -->
    <path d="M 256 372 C 208 335 152 329 116 335 C 109 336 104 331 104 324 L 104 271 C 104 264 110 259 116 258 C 156 252 212 258 256 292 Z" 
          fill="url(#xb-page-main)" />
    <!-- 右书页 -->
    <path d="M 256 372 C 304 335 360 329 396 335 C 403 336 408 331 408 324 L 408 271 C 408 264 402 259 396 258 C 356 252 300 258 256 292 Z" 
          fill="url(#xb-page-main)" />
    <!-- 书脊中心微立体光影 -->
    <path d="M 254 292 L 258 292 L 258 372 L 254 372 Z" fill="#CBD5E1" opacity="0.6" />

    <!-- 3. 【学霸黄金冠顶】利落现代学士帽 · 象征名校升学与拔尖高分 -->
    <!-- 帽子圆弧基座 (贴合书卷上方，形成高低韵律) -->
    <path d="M 198 184 L 198 214 C 198 234 224 248 256 248 C 288 248 314 234 314 214 L 314 184 C 294 196 276 202 256 202 C 236 202 218 196 198 184 Z" 
          fill="#B45309" />

    <!-- 扁平几何菱形帽顶：左右双切面高光，利落立体 -->
    <!-- 左半部明亮受光面 -->
    <polygon points="256,124 148,168 256,212 256,124" fill="url(#xb-gold-light)" />
    <!-- 右半部暖金反光面 -->
    <polygon points="256,124 364,168 256,212 256,124" fill="url(#xb-gold-dark)" />
    <!-- 帽顶轮廓极细高光金线 -->
    <polygon points="256,125 151,168 256,210 361,168" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2" />

    <!-- 学士帽中心金色纽扣 -->
    <circle cx="256" cy="168" r="8" fill="#FEF08A" stroke="#B45309" stroke-width="1.5" />

    <!-- 飘逸流苏 (简约有型) -->
    <path d="M 256 168 Q 336 178 350 208" stroke="url(#xb-tassel)" stroke-width="6" stroke-linecap="round" fill="none" />
    <!-- 流苏挂穗 -->
    <path d="M 350 208 L 344 238 C 344 241 356 241 356 238 L 350 208 Z" fill="url(#xb-tassel)" />
    <circle cx="350" cy="209" r="4" fill="#FEF08A" />

    <!-- 4. 【卓越启明星】跃然帽顶之上的四芒星芒 · 象征领航与金榜题名 -->
    <g filter="url(#xb-star-glow)">
      <!-- 极简四芒星 -->
      <path d="M 256 68 Q 256 86 274 86 Q 256 86 256 104 Q 256 86 238 86 Q 256 86 256 68 Z" 
            fill="#FFFFFF" />
      <circle cx="256" cy="86" r="3" fill="#FEF08A" />
    </g>

  </g>
</svg>
