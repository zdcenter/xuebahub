services:
  postgres:
    image: postgres:16-alpine
    container_name: netdisk_postgres
    restart: always
    environment:
      POSTGRES_USER: netdisk_user
      POSTGRES_PASSWORD: netdisk_password123
      POSTGRES_DB: netdisk_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../docs/db_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netdisk_user -d netdisk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
