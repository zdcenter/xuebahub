# ============================================================
# Xuebaw Netdisk API 反向代理配置
# 域名: api.xuebaw.com  端口: 8443
# 前端由 Cloudflare Pages / Astro 托管，nginx 仅负责 API 代理
# ============================================================

upstream netdisk_api {
    server 127.0.0.1:4001;
    keepalive 32;
}

server {
    listen 8443 ssl http2;
    server_name api.xuebaw.com;

    ssl_certificate     /etc/nginx/ssl/xuebaw/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/xuebaw/xuebaw.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL_XUEBAW:10m;
    ssl_session_timeout 10m;

    # ─── API & WebSocket 反代 ───
    location /api/ {
        # OPTIONS 预检：CORS 头必须写在 if 块内部，否则 nginx 不会带上
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin      $http_origin;
            add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers     "DNT, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type, Range, Authorization, x-skip-logout";
            add_header Access-Control-Allow-Credentials "true";
            add_header Access-Control-Max-Age           86400;
            add_header Content-Length                   0;
            return 204;
        }

        # 实际请求的 CORS 头
        add_header Access-Control-Allow-Origin      $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        proxy_pass http://netdisk_api;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout  5s;
        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
    }

    # 其余路径拦截
    location / {
        return 444;
    }
}
